<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Atelier | Dimensione Dolce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --magenta:#E91E8C; --magenta-dark:#C4177A;
    --pistacchio:#BBC25C; --pistacchio-scuro:#A3AA42;
    --cioccolato:#382E2C; --cioccolato-deep:#2C2322;
    --crema:#F2F1F0; --crema-warm:#F7F6F4; --beige:#E8E5E1;
    --bianco:#fff; --testo:#382E2C; --testo-light:#6E6462; --testo-muted:#9A9290;
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-ui:'Montserrat','Helvetica Neue',sans-serif;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
  body{font-family:var(--font-ui);font-size:16px;color:var(--testo);background:var(--crema);overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .hdr{position:sticky;top:0;z-index:50;background:rgba(242,241,240,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(56,46,44,0.08)}
  .hdr__inner{max-width:1400px;margin:0 auto;padding:18px 40px;display:flex;align-items:center;gap:32px}
  .hdr__brand{display:flex;align-items:center}
  .hdr__brand img{height:38px;width:auto;display:block}
  .hdr__tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .hdr__tabs::-webkit-scrollbar{display:none}
  .hdr__tab{font-family:var(--font-ui);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--testo-muted);padding:10px 18px;border-radius:999px;white-space:nowrap;transition:all .3s}
  .hdr__tab:hover{color:var(--testo)}
  .hdr__tab.is-active{background:var(--cioccolato);color:var(--bianco)}
  .hdr__cart{display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--cioccolato);border-radius:999px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;transition:all .3s}
  .hdr__cart:hover{background:var(--cioccolato);color:var(--bianco)}
  .hdr__cart-count{background:var(--pistacchio);color:var(--cioccolato);border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:0 6px}

  .hero{padding:120px 40px 80px;text-align:center;background:linear-gradient(180deg,var(--crema-warm) 0%,var(--crema) 100%)}
  .hero__kicker{font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--pistacchio-scuro);margin-bottom:24px}
  .hero__title{font-family:var(--font-display);font-size:clamp(48px,8vw,104px);font-weight:400;line-height:.95;color:var(--testo);font-style:italic}
  .hero__title em{color:var(--pistacchio-scuro);font-style:italic;font-weight:500}
  .hero__lede{max-width:520px;margin:32px auto 0;font-size:15px;line-height:1.8;color:var(--testo-light)}

  .sec{padding:80px 0;position:relative}
  .sec--white{background:var(--bianco)}
  .sec__head{max-width:1200px;margin:0 auto 56px;padding:0 40px 24px;display:flex;align-items:baseline;gap:24px;border-bottom:1px solid rgba(56,46,44,0.08)}
  .sec__num{font-family:var(--font-display);font-style:italic;font-size:28px;color:var(--pistacchio-scuro);font-weight:500;min-width:40px}
  .sec__title{font-family:var(--font-display);font-size:clamp(32px,4vw,48px);font-weight:400;color:var(--testo);line-height:1}
  .sec__count{margin-left:auto;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--testo-muted);font-weight:500}

  .carousel{
    position:relative;overflow:hidden;padding:20px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,black 4%,black 96%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0%,black 4%,black 96%,transparent 100%);
  }
  .carousel__track{
    display:flex;gap:32px;width:max-content;
    animation:marquee 80s linear infinite;
    will-change:transform;
    padding:0 16px;
  }
  .carousel:hover .carousel__track,
  .carousel:focus-within .carousel__track{animation-play-state:paused}
  @keyframes marquee{
    from{transform:translateX(0)}
    to{transform:translateX(calc(-50% - 16px))}
  }

  .prod{flex:0 0 auto;width:320px;position:relative;transition:transform .6s cubic-bezier(.16,1,.3,1)}
  .prod:hover{transform:translateY(-6px)}
  .prod__img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--beige);border-radius:4px}
  .prod__img img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.16,1,.3,1)}
  .prod:hover .prod__img img{transform:scale(1.06)}
  .prod__badge{position:absolute;top:16px;left:16px;background:var(--bianco);color:var(--cioccolato);font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;padding:6px 12px;border-radius:999px;z-index:2}
  .prod__add{position:absolute;bottom:16px;right:16px;width:44px;height:44px;border-radius:999px;background:var(--cioccolato);color:var(--bianco);font-size:20px;font-weight:300;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:all .4s cubic-bezier(.16,1,.3,1);z-index:2}
  .prod:hover .prod__add,.prod:focus-within .prod__add{opacity:1;transform:translateY(0)}
  .prod__add:hover{background:var(--pistacchio);color:var(--cioccolato);transform:scale(1.08)!important}

  .prod__body{padding:20px 2px 0}
  .prod__name{font-family:var(--font-display);font-style:italic;font-size:22px;font-weight:400;color:var(--testo);line-height:1.2;margin-bottom:8px}
  .prod__desc{font-size:13px;line-height:1.6;color:var(--testo-light);margin-bottom:16px;min-height:42px}
  .prod__variants{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .prod__variant{font-family:var(--font-ui);font-size:11px;font-weight:500;letter-spacing:.06em;padding:7px 14px;border:1px solid rgba(56,46,44,0.18);border-radius:999px;color:var(--testo-light);transition:all .3s;line-height:1}
  .prod__variant:hover{border-color:var(--testo);color:var(--testo)}
  .prod__variant.is-active{background:var(--cioccolato);border-color:var(--cioccolato);color:var(--bianco)}
  .prod__footer{display:flex;align-items:baseline;justify-content:space-between}
  .prod__price{font-family:var(--font-display);font-style:italic;font-size:22px;font-weight:500;color:var(--pistacchio-scuro);transition:opacity .3s}
  .prod__price-from{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--testo-muted);font-family:var(--font-ui);font-weight:500;font-style:normal;margin-right:4px}

  .gelato{flex:0 0 auto;width:280px;aspect-ratio:3/4;border-radius:4px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;color:var(--cioccolato-deep);transition:transform .6s cubic-bezier(.16,1,.3,1);cursor:pointer}
  .gelato:hover{transform:translateY(-6px)}
  .gelato::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.4),transparent 60%);opacity:.6}
  .gelato > *{position:relative;z-index:1}
  .gelato__kicker{font-size:10px;letter-spacing:.25em;text-transform:uppercase;font-weight:600;margin-bottom:12px;opacity:.7}
  .gelato__name{font-family:var(--font-display);font-style:italic;font-size:32px;font-weight:500;line-height:1.05;margin-bottom:14px}
  .gelato__desc{font-size:13px;line-height:1.6;opacity:.75}
  .gelato--pistacchio{background:#BBC25C}
  .gelato--amarena{background:#C06080}
  .gelato--albicocca{background:#F4A858}
  .gelato--vaniglia{background:#F0E4C8;color:var(--cioccolato)}
  .gelato--lampone{background:#D4344B;color:var(--bianco)}
  .gelato--limone{background:#F0D84A}

  .toast{position:fixed;bottom:-100px;left:50%;transform:translateX(-50%);background:var(--cioccolato);color:var(--bianco);padding:14px 24px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.05em;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);transition:bottom .5s cubic-bezier(.16,1,.3,1);z-index:100}
  .toast.is-visible{bottom:24px}
  .toast__dot{width:6px;height:6px;border-radius:999px;background:var(--pistacchio)}

  @media(max-width:768px){
    .hdr__inner{padding:14px 20px;gap:16px}
    .hdr__brand img{height:30px}
    .hdr__tab{font-size:10px;padding:8px 14px}
    .hdr__cart{padding:8px 12px;font-size:10px}
    .hero{padding:72px 24px 56px}
    .sec{padding:56px 0}
    .sec__head{margin-bottom:36px;padding:0 20px 20px;flex-wrap:wrap;gap:12px}
    .sec__count{width:100%;margin-left:0;order:3}
    .carousel__track{gap:20px;padding:0 12px;animation-duration:60s}
    .prod{width:260px}
    .prod__img{aspect-ratio:1/1}
    .prod__add{opacity:1;transform:none;width:44px;height:44px}
    .gelato{width:230px;padding:22px}
    .gelato__name{font-size:26px}
  }

  @media(prefers-reduced-motion:reduce){
    .carousel__track{animation:none}
  }
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr__inner">
    <a href="/" class="hdr__brand" aria-label="Dimensione Dolce"><img src="/assets/img/logo-dimensione-dolce-dark.png" alt="Dimensione Dolce"></a>
    <nav class="hdr__tabs">
      <a href="#colazione" class="hdr__tab is-active">Colazione</a>
      <a href="#monoporzioni" class="hdr__tab">Monoporzioni</a>
      <a href="#gelateria" class="hdr__tab">Gelateria</a>
    </nav>
    <button class="hdr__cart">Ordine <span class="hdr__cart-count" id="count">0</span></button>
  </div>
</header>

<section class="hero">
  <div class="hero__kicker">La carta</div>
  <h1 class="hero__title">Il nostro <em>menu</em></h1>
  <p class="hero__lede">Scegli le tue preferite, personalizza con le varianti, porta a casa il gusto di Dimensione Dolce.</p>
</section>

<section class="sec sec--white" id="colazione">
  <header class="sec__head">
    <span class="sec__num">I.</span>
    <h2 class="sec__title">Colazione</h2>
    <span class="sec__count" id="count-colazione"></span>
  </header>
  <div class="carousel"><div class="carousel__track" id="track-colazione"></div></div>
</section>

<section class="sec" id="monoporzioni">
  <header class="sec__head">
    <span class="sec__num">II.</span>
    <h2 class="sec__title">Monoporzioni</h2>
    <span class="sec__count" id="count-monoporzioni"></span>
  </header>
  <div class="carousel"><div class="carousel__track" id="track-monoporzioni"></div></div>
</section>

<section class="sec sec--white" id="gelateria">
  <header class="sec__head">
    <span class="sec__num">III.</span>
    <h2 class="sec__title">Gelateria</h2>
    <span class="sec__count" id="count-gelateria"></span>
  </header>
  <div class="carousel"><div class="carousel__track" id="track-gelateria"></div></div>
</section>

<div class="toast" id="toast"><span class="toast__dot"></span><span id="toastMsg">Aggiunto</span></div>

<script>
  const PRODUCTS = {
    colazione: [
      { name: 'Croissant', image: '/assets/img/products/01_Croissant_crema_e_frutti_rossi.webp', badge: 'Iconico',
        desc: 'Sfoglia dorata, lievitazione di 48 ore, burro francese AOP.',
        variants: [
          { name: 'Crema e frutti rossi', price: 3.00 },
          { name: 'Pistacchio', price: 3.50 },
          { name: 'Cioccolato', price: 3.20 },
          { name: 'Crema vaniglia', price: 2.80 },
        ]},
      { name: 'Brioche Scanalata', image: '/assets/img/products/02_Brioche_scanalata_con_crema.webp',
        desc: 'Impasto soffice al burro, lievitazione naturale, farcitura a scelta.',
        variants: [
          { name: 'Crema Vaniglia', price: 2.80 },
          { name: 'Pistacchio', price: 3.00 },
          { name: 'Cioccolato', price: 2.90 },
        ]},
      { name: 'Pain au Chocolat', image: '/assets/img/products/04_Pain_au_chocolat_spirale.webp',
        desc: 'Sfogliatura a spirale, cuore di cioccolato fondente Valrhona.',
        variants: [{ name: 'Classico', price: 3.20 }]},
      { name: 'Bomboloni', image: '/assets/img/products/03_Bomboloni_allo_zucchero.webp',
        desc: 'Fritti a mano e zuccherati al momento.',
        variants: [
          { name: 'Naturale', price: 2.50 },
          { name: 'Crema', price: 2.80 },
          { name: 'Nutella', price: 2.80 },
          { name: 'Marmellata', price: 2.80 },
        ]},
      { name: 'Cruffin ai Frutti di Bosco', image: '/assets/img/products/05_Cruffin_ai_frutti_di_bosco.webp',
        desc: 'Incontro tra croissant e muffin, farcito con composta ai frutti di bosco.',
        variants: [{ name: 'Classico', price: 3.50 }]},
    ],
    monoporzioni: [
      { name: "Limone Trompe-l'oeil", image: '/assets/img/products/09_Limone_trompe_loeil.webp',
        desc: 'Mousse al limone e basilico, cuore di gelee agli agrumi, glassa gialla a specchio.',
        variants: [{ name: 'Monoporzione', price: 7.00 }]},
      { name: 'Pera al Cioccolato', image: '/assets/img/products/10_Pera_al_cioccolato.webp',
        desc: 'Mousse al cioccolato fondente, insert di pera Williams, biscotto alle noci.',
        variants: [{ name: 'Monoporzione', price: 6.50 }]},
      { name: "Pera Trompe-l'oeil", image: '/assets/img/products/11_Pera_trompe_loeil.webp',
        desc: 'Mousse alla pera e vaniglia, cuore di caramello al burro salato, glassa realistica.',
        variants: [{ name: 'Monoporzione', price: 7.00 }]},
      { name: 'Tulipano alla Pesca', image: '/assets/img/products/12_Tulipano_pesca.webp',
        desc: "Mousse alla pesca e fiori d'arancio, biscotto alla mandorla, petalo dipinto a mano.",
        variants: [{ name: 'Monoporzione', price: 7.50 }]},
      { name: 'Cupola Rossa al Cioccolato', image: '/assets/img/products/13_Cupola_rossa_in_cioccolato.webp',
        desc: 'Mousse al cioccolato, glassa rossa lucida a specchio, base brownie fondente.',
        variants: [{ name: 'Monoporzione', price: 7.00 }]},
      { name: 'Tiramisu', image: '/assets/img/products/14_Tiramisu_monoporzione.webp',
        desc: 'Savoiardi imbevuti nel nostro caffè, crema al mascarpone fresco, cacao Valrhona.',
        variants: [{ name: 'Monoporzione', price: 6.00 }]},
      { name: 'Tarte au Citron Meringuée', image: '/assets/img/products/15_Tarte_au_citron_meringuee.webp',
        desc: 'Frolla al burro, crema al limone vellutata, meringa italiana fiammeggiata.',
        variants: [{ name: 'Monoporzione', price: 6.50 }]},
      { name: "Tartina Mango e Foglia d'Oro", image: '/assets/img/products/16_Tartina_mango_foglia_doro.webp',
        desc: "Mousse esotica al mango e passion fruit, base croccante, foglia d'oro alimentare.",
        variants: [{ name: 'Monoporzione', price: 8.00 }]},
      { name: 'Trancio Tre Cioccolati', image: '/assets/img/products/17_Trancio_tre_cioccolati.webp',
        desc: 'Tre strati di mousse fondente, latte e bianco su biscotto croccante al cacao.',
        variants: [{ name: 'Monoporzione', price: 6.00 }]},
      { name: "Monoporzione all'Albicocca", image: '/assets/img/products/18_Monoporzione_albicocca.webp',
        desc: "Mousse all'albicocca, insert alla vaniglia Bourbon, glassa arancione brillante.",
        variants: [{ name: 'Monoporzione', price: 6.50 }]},
      { name: 'Choux alla Crema', image: '/assets/img/products/20_Choux_alla_crema.webp',
        desc: 'Pasta choux croccante, crema leggera alla vaniglia, finitura al cioccolato.',
        variants: [{ name: 'Monoporzione', price: 5.50 }]},
    ],
    gelateria: [
      { name: 'Pistacchio di Bronte DOP', color: 'pistacchio', kicker: 'Sicilia',
        desc: 'Pasta pura di pistacchio siciliano, tostato e macinato a pietra. Intensità verde, note terrose.' },
      { name: 'Amarena e Fior di Latte', color: 'amarena', kicker: 'Tradizione',
        desc: "Crema al latte fresco con variegatura di amarene sciroppate. Equilibrio dell'acidulo." },
      { name: 'Albicocca', color: 'albicocca', kicker: 'Stagionale',
        desc: 'Sorbetto di albicocche del Vesuvio al punto di maturazione. Dolcezza naturale.' },
      { name: 'Vaniglia del Madagascar', color: 'vaniglia', kicker: 'Signature',
        desc: 'Baccelli interi in infusione. La nostra crema classica, densa e profumata.' },
      { name: 'Lampone', color: 'lampone', kicker: 'Sorbetto',
        desc: 'Sorbetto ai lamponi freschi, nessun aroma aggiunto. Colore e gusto vividi.' },
      { name: 'Limone di Sorrento', color: 'limone', kicker: 'IGP',
        desc: 'Sorbetto al limone IGP, scorza e succo. Fresco, pulito, dissetante.' },
    ]
  };

  function el(tag, cls){ const e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function fromPrice(variants){ return Math.min(...variants.map(v => v.price)); }
  function fmtPrice(p){ return '€' + (Number.isInteger(p) ? p : p.toFixed(2).replace(/\.00$/, '')); }

  function buildProdCard(data) {
    const card = el('article', 'prod');

    const imgWrap = el('div', 'prod__img');
    if (data.badge) {
      const badge = el('span', 'prod__badge');
      badge.textContent = data.badge;
      imgWrap.appendChild(badge);
    }
    const img = el('img');
    img.src = data.image; img.alt = data.name; img.loading = 'lazy';
    imgWrap.appendChild(img);
    const add = el('button', 'prod__add');
    add.textContent = '+'; add.setAttribute('aria-label', 'Aggiungi ' + data.name);
    imgWrap.appendChild(add);

    const body = el('div', 'prod__body');
    const name = el('h3', 'prod__name'); name.textContent = data.name;
    const desc = el('p', 'prod__desc'); desc.textContent = data.desc;
    body.appendChild(name); body.appendChild(desc);

    const hasMultiple = data.variants.length > 1;
    if (hasMultiple) {
      const group = el('div', 'prod__variants');
      data.variants.forEach((v, i) => {
        const btn = el('button', 'prod__variant' + (i === 0 ? ' is-active' : ''));
        btn.dataset.price = v.price;
        btn.textContent = v.name;
        group.appendChild(btn);
      });
      body.appendChild(group);
    }

    const footer = el('div', 'prod__footer');
    const priceEl = el('span', 'prod__price');
    if (hasMultiple) {
      const from = el('span', 'prod__price-from');
      from.textContent = 'da';
      priceEl.appendChild(from);
      priceEl.appendChild(document.createTextNode(fmtPrice(fromPrice(data.variants))));
    } else {
      priceEl.textContent = fmtPrice(data.variants[0].price);
    }
    footer.appendChild(priceEl);
    body.appendChild(footer);

    card.appendChild(imgWrap);
    card.appendChild(body);

    if (hasMultiple) {
      body.querySelectorAll('.prod__variant').forEach((btn) => {
        btn.addEventListener('click', () => {
          body.querySelectorAll('.prod__variant').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          priceEl.style.opacity = '0';
          setTimeout(() => {
            while (priceEl.firstChild) priceEl.removeChild(priceEl.firstChild);
            priceEl.textContent = fmtPrice(+btn.dataset.price);
            priceEl.style.opacity = '1';
          }, 180);
        });
      });
    }

    add.addEventListener('click', (e) => {
      e.stopPropagation();
      addToCart(data.name);
    });

    return card;
  }

  function buildGelatoCard(data) {
    const card = el('article', 'gelato gelato--' + data.color);
    const kicker = el('p', 'gelato__kicker'); kicker.textContent = data.kicker;
    const name = el('h3', 'gelato__name'); name.textContent = data.name;
    const desc = el('p', 'gelato__desc'); desc.textContent = data.desc;
    card.appendChild(kicker);
    card.appendChild(name);
    card.appendChild(desc);
    return card;
  }

  function renderCarousel(sectionKey, builder) {
    const track = document.getElementById('track-' + sectionKey);
    const items = PRODUCTS[sectionKey];
    for (let pass = 0; pass < 2; pass++) {
      items.forEach(item => {
        const card = builder(item);
        if (pass === 1) card.setAttribute('aria-hidden', 'true');
        track.appendChild(card);
      });
    }
    const countEl = document.getElementById('count-' + sectionKey);
    if (countEl) countEl.textContent = String(items.length).padStart(2, '0') + ' ' + (items.length === 1 ? 'Prodotto' : 'Prodotti');
  }

  renderCarousel('colazione', buildProdCard);
  renderCarousel('monoporzioni', buildProdCard);
  renderCarousel('gelateria', buildGelatoCard);

  let count = 0;
  const countEl = document.getElementById('count');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');

  function addToCart(name) {
    count++;
    countEl.textContent = count;
    toastMsg.textContent = name + ' aggiunto';
    toast.classList.add('is-visible');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll('.hdr__tab').forEach(t => t.classList.remove('is-active'));
        const tab = document.querySelector('.hdr__tab[href="#' + e.target.id + '"]');
        if (tab) tab.classList.add('is-active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  ['colazione','monoporzioni','gelateria'].forEach(id => {
    const s = document.getElementById(id);
    if (s) observer.observe(s);
  });
</script>
